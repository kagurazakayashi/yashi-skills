name: Build skills index HTML

# README.md 是本仓库 skill 索引的「人读版」，由 AI 撰写与润色。
# CI 不具备 AI 能力，因此这里只把 README.md 当作 HTML 的生成源，绝不重建它
# （用 --html-only）。产物是仓库根的 ./index.html，提交回 main。
#
# 语言：README.md 为 zh-Hans，HTML 默认也是 zh-Hans，两侧一致 =>
# 脚本不需要翻译草稿 / 译文复用那套机制，CI 里可以无状态直接产出。

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'   # skill 定义、构建脚本及其 assets（css / js / 示例）都在这里
      - 'README.md'   # HTML 的生成源变了，也要重出
      - '.github/workflows/skills-index-html.yml'
  workflow_dispatch:

# 推送用 PAT（secrets.ACCESS_TOKEN），GITHUB_TOKEN 只保留读权限
permissions:
  contents: read

# 同一分支串行，避免并发推送互相覆盖
concurrency:
  group: skills-index-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 署名与 GPG 密钥沿用 CodeNotebook/.github/workflows/main.yml
      - name: ImportGPG
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          git_config_global: true
          gpg_private_key: ${{ secrets.PGP_PRIVATE_KEY_BLOCK }}
          passphrase: ${{ secrets.PGP_PRIVATE_KEY_PASSPHRASE }}
          fingerprint: "9A9121AFE0002AB746FB0B1079A9CCDDB8C957F3"
          git_user_signingkey: true
          git_commit_gpgsign: true
          trust_level: 5
          git_committer_name: "KagurazakaYashi"
          git_committer_email: "yashi@uuu.moe"

      # 只渲染 HTML；README.md 仅作源，不会被改动
      - name: Generate index.html
        run: |
          python skills/yashi-build-skills-index/scripts/build_skills_index.py \
            --skills-dir skills \
            --include 'yashi-*' \
            --output README.md \
            --html index.html \
            --html-only

      - name: Push
        run: |
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo "index.html 无变化，跳过提交。"
            exit 0
          fi
          gpg -K
          git config --global user.name "神楽坂雅絵[bot]"
          git config --global user.email "masae@uuu.moe"
          echo "添加..."
          git add -- index.html
          echo "签名..."
          git commit -S -m "chore: 自动更新 skills 索引 HTML [skip ci]" -m "由 ${{ github.actor }} 触发，运行 ${{ github.run_id }}"
          echo "令牌..."
          git remote set-url origin "https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/${{ github.repository }}"
          echo "推送..."
          git push
